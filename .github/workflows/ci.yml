name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  bypass-gate:
    # Keyless, deterministic regression gate: fails the build if a guard still
    # lets a recorded bypass through. Runs against the fixed example guards here;
    # in your own repo, point --cases at your guards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: LoopHole bypass gate
        run: python -m harness.check --offline --cases examples.fixed_guards:CASES
